name: Update README TODO
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-todo.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Rewrite README TODO list
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          title = '### 📝 Complete TODO List'
          start = text.index(title)
          end = text.index('## 🤝 Contributing', start)
          section = text[start:end]
          m = re.compile(r'^- \[ \] \*\*(?P<path>.+):(?P<line>\d+)\*\* - (?P<text>.*)$')
          targets = {
            'luffy/deepscaler/utils.py': [
              (45, 'Add logging for API calls and errors'),
              (46, 'Support batch processing for multiple prompts'),
              (47, 'Add timeout configuration for API calls'),
              (107, 'Implement Vertex AI initialization and authentication'),
              (108, 'Configure safety settings for content generation'),
              (109, 'Set up GenerativeModel with proper system instructions'),
              (110, 'Implement retry logic with exponential backoff'),
              (111, 'Add comprehensive error handling for API access issues'),
              (112, 'Handle rate limiting and quota management'),
              (113, 'Implement response validation and text extraction'),
              (114, 'Add support for different generation configurations'),
            ],
            'luffy/verl/verl/protocol.py': [
              (114, 'Optimize memory usage during tensor reshaping'),
              (115, 'Add support for different tensor types and shapes'),
              (136, 'Optimize tensor view operations for performance'),
              (137, 'Add error handling for invalid batch dimensions'),
              (169, '(zhangchi.usc1992) add consistency check'),
              (265, 'we can actually lift this restriction if needed'),
              (351, '(zhangchi.usc1992) whether to copy'),
            ],
          }
          entries = []
          old_target = 0
          for line in section.splitlines():
              mm = m.match(line)
              if not mm:
                  continue
              path = mm.group('path')
              if path in targets:
                  old_target += 1
                  continue
              entries.append({'path': path, 'line': int(mm.group('line')), 'line_text': line})
          print('preserved entries', len(entries), 'old target entries', old_target)
          for path, items in targets.items():
              for line, text in items:
                  entries.append({
                      'path': path,
                      'line': line,
                      'line_text': f'- [ ] **{path}:{line}** - {text}',
                  })
          entries.sort(key=lambda e: (e['path'], e['line']))
          body = '\n'.join(e['line_text'] for e in entries)
          new_section = title + '\n\n' + body + '\n\n'
          p.write_text(text[:start] + new_section + text[end:])
          print('total entries', len(entries))
          PY
      - name: Commit README
        run: |
          git config user.name 'neutronhemomancerhem'
          git config user.email 'sandjix196850@gmail.com'
          git add README.md
          if git diff --cached --quiet; then echo 'No README changes'; else git commit -m 'docs: update README TODO list'; git push; fi
